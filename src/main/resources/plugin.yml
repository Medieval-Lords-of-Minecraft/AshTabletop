name: AshTabletop
main: me.ascheladd.ashtabletop.AshTabletop
version: 0.0.1-SNAPSHOT
description: A suite of tabletop chat games for Paper 26.2.
authors: [Ascheladd]
website: https://ml-mc.com
api-version: '26.2'
depend: [NeoCore]
commands:
  tt:
    description: Main tabletop command
    usage: /tt
    permission: tabletop.use
  tta:
    description: Tabletop administration
    usage: /tta
    permission: tabletop.admin
  thecrew:
    description: Commands for The Crew
    usage: /thecrew
    permission: tabletop.use
  mono:
    description: Commands for Monopoly
    aliases: [monopoly]
    usage: /mono
    permission: tabletop.use
  uno:
    description: Commands for Uno
    usage: /uno
    permission: tabletop.use
permissions:
  tabletop.use:
    default: true
  tabletop.admin:
    default: op
