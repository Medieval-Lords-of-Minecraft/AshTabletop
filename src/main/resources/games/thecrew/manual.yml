  4:
    1:
      text: "&6&l>&8&m--------------&c&l» &e3a. Sonar Tokens «&8&m--------------&6&l<\n"
    2: 
      text: "&7You may use &fSonar Tokens &7to communicate to your team about a card. You may communicate if a card is the highest, lowest, or only card of any color in your hand. If a card is none of those, you may not use a sonar token on that card.\n"
