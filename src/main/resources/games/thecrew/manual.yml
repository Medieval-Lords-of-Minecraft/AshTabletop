  3:
    1:
      text: "&6&l>&8&m--------------&c&l» &e3. Trick-taking «&8&m--------------&6&l<\n"
    2: 
      text: "&7In &eThe Crew&7, the first player to put down a card sets the rule for the round. If you have a card that is the same &fcolor &7as the first card, you may &fonly put down that color. If you don't have the same color, you may put down any card.\n\n"
    3:
      text: "&7After all players put down a card, the winner is the highest numbered card that is the same color as the first card. The only exception is &8&lSubmarine Cards&7, which are wildcards and win even if the first card is a different color. The trick is that &8&lSubmarine Cards &7can only be played if you don't have the same color as the first card, per the rule above.\n\n"
    4:
      text: "&7On the first round, The &fCaptain &7plays the first card. In all subsequent rounds, the winner of the previous round plays the first card.\n"
    footer1: 
      text: "&6&l>&8&m--------------- "
