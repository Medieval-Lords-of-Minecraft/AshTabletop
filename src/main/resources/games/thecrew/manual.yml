    1:
      text: "&6&l>&8&m---------------&c&l» &eThe Crew «&8&m---------------&6&l<\n"
    2: 
      text: "&eThe Crew &7is a cooperative trick-taking card game. The goal of the game is to complete all the tasks you're given before everyone runs out of cards.\n\n"
    3: 
      text: "&7The game begins by passing out 40 cards equally divided between all players. The deck consists of &cRed&7, &9Blue&7, &2Green&7, and &eYellow&7 cards numbered 1-9 and 4 &8&lSubmarine&7 cards numbered 1-4. The player who gets the &8&l4 Submarine &7is the &fCaptain&7. We'll get back to what these mean later.\n\n"
    4:
      text: "&7In a trick-taking game, you have multiple rounds. Each player in turn order puts down 1 card per round. The player with the highest value card &fwins&7 all of the cards put down that round. Then you do this again until everyone has no cards left.\n\n"
    5:
      text: "&7You may NOT communicate during the entire game except with &fSonar Tokens&7! Not knowing what other people are trying to do is part of the difficulty!\n"
    footer1: 
      text: "&6&l>&8&m--------------- "
