  2:
    1:
      text: "&6&l>&8&m--------------&c&l» &e2. Task Assignment «&8&m--------------&6&l<\n"
    2: 
      text: "&7Starting with The &fCaptain&7, each player chooses 1 task to complete until all tasks are taken. Some tasks may be impossible for certain players, so you should try picking the hardest tasks you can handle so that others don't get them!\n"
    footer1: 
      text: "&6&l>&8&m--------------- "
