  1:
    1:
      text: "&6&l>&8&m--------------&c&l» &e1. Task Rolling «&8&m--------------&6&l<\n"
    2: 
      text: "&eTask Rolling &7is the first stage. Depending on the &fdifficulty &7parameter you set, the game will randomly choose some tasks. At higher difficulties, some tasks may conflict with each other and make them impossible. The &fCaptain &7can then choose to reroll the tasks or keep them.\n"
    footer1: 
      text: "&6&l>&8&m--------------- "
    prev:
      text: "&c&l« &fPrevious"
