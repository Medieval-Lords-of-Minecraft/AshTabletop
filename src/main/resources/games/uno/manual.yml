1:
  - '<gold>Uno</gold><newline>'
  - 'Create with /tt create uno [lobby], invite/join using /tt, then /tt start. Each player receives seven cards.<newline>'
  - 'Click cards in /uno hand or use /uno play [alias]: 7r, skipb, reverseg, +2y, wild or +4. Colors are r/b/g/y.<newline>'
  - 'Match the active color or card type. Wild cards match anything. Pending draws may be stacked with matching +2/+4 cards or taken with /uno draw, which skips your turn.<newline>'
  - 'A normal draw automatically plays the drawn card if it matches; otherwise it stays in your hand. Skip skips one player; reverse reverses direction (with two players, the other player goes next, as in NeoUno).'
  - 'Discarded cards are reshuffled when needed. If all drawable cards are held in hands, a fresh deck is added following the sibling game, so stacked draws cannot deadlock.'
2:
  - '<gold>Colors, challenges and scoring</gold><newline>'
  - 'Wild cards require /uno color [r|b|g|y], or the color dialog. Closing leaves the choice pending; /uno menu reopens it. Wilds preserve the previous matching card type, as in NeoUno.<newline>'
  - 'Use /uno uno with one card, or before playing your second-to-last card. /uno challenge [player] makes a player with one card draw two if they finished their turn without calling Uno.<newline>'
  - 'First to empty their hand wins the round. Number cards score face value; all action/wild cards score 10, following NeoUno.<newline>'
  - 'Set /tt set points [score] in the lobby. 0 plays continuous rounds; a positive target returns everyone to the lobby when someone reaches it.<newline>'
  - '/uno players shows counts and scores; spectators cannot see hands. Disconnected players retain seats and wait on their turn. /tt kick removes them; /tt leave exits; the host can /tt return.'
